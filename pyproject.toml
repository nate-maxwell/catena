[build-system]
requires = ["setuptools"]

[tool.setuptools]
packages = ["catena"]

[project]
name = "Catena"
authors = [
    {name = "Nathan Maxwell"}
]
description = "A hobby application for procedurally building textures through node graphs."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["python", "PySide", "editor", "texture", "node", "procedural"]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    'importlib-metadata; python_version<"3.10"',
    "PySide6",
    "opencv-python",
    "numpy",
    "scipy",
    "PyOpenGL",
    "imageio",

    "core-utils @ git+https://github.com/nate-maxwell/core_utils.git",
    "broker @ git+https://github.com/nate-maxwell/broker.git@v1.14.2",
    "pyside6tk @ git+https://github.com/nate-maxwell/PySide6TK.git",
]
version = "0.1.0"

[project.urls]
Homepage = "https://github.com/nate-maxwell/catena"
Source = "https://github.com/nate-maxwell/catena"
